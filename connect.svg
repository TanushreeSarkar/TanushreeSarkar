<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160" role="img" aria-label="Connect with Tanushree Sarkar">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-160px) skewX(-15deg)}60%,100%{transform:translateX(880px) skewX(-15deg)}}
.row{opacity:0;animation:fadeUp .45s ease forwards}
.sh{animation:shineX 5s ease-in-out 2.4s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#c084fc;#ff7eb6;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="718" height="158" rx="16"/></clipPath>
</defs>

<rect x="1" y="1" width="718" height="158" rx="16" fill="#170e28" stroke="url(#tg)" stroke-width="1.5"/>
<text x="26" y="46" font-size="20" font-weight="bold" fill="url(#tg)">🌐 Connect with Me</text>
<line x1="26" y1="60" x2="694" y2="60" stroke="#2a1f3d" stroke-width="1"/>

<g class="row" style="animation-delay:0.35s"><rect x="26.0" y="92.0" width="92.2" height="34" rx="17.0" fill="#1d1330" stroke="#f57224" stroke-width="1.3"/><circle cx="46.0" cy="109.0" r="5" fill="#f57224"/><text x="60.0" y="114.0" font-size="13" font-weight="bold" fill="#e6edf3">Blogger</text></g><g class="row" style="animation-delay:0.43s"><rect x="130.2" y="92.0" width="92.2" height="34" rx="17.0" fill="#1d1330" stroke="#5865F2" stroke-width="1.3"/><circle cx="150.2" cy="109.0" r="5" fill="#5865F2"/><text x="164.2" y="114.0" font-size="13" font-weight="bold" fill="#e6edf3">Discord</text></g><g class="row" style="animation-delay:0.51s"><rect x="234.4" y="92.0" width="105.4" height="34" rx="17.0" fill="#1d1330" stroke="#E4405F" stroke-width="1.3"/><circle cx="254.4" cy="109.0" r="5" fill="#E4405F"/><text x="268.4" y="114.0" font-size="13" font-weight="bold" fill="#e6edf3">Instagram</text></g><g class="row" style="animation-delay:0.59s"><rect x="351.8" y="92.0" width="98.8" height="34" rx="17.0" fill="#1d1330" stroke="#0077B5" stroke-width="1.3"/><circle cx="371.8" cy="109.0" r="5" fill="#0077B5"/><text x="385.8" y="114.0" font-size="13" font-weight="bold" fill="#e6edf3">LinkedIn</text></g><g class="row" style="animation-delay:0.67s"><rect x="462.6" y="92.0" width="52.6" height="34" rx="17.0" fill="#1d1330" stroke="#e6edf3" stroke-width="1.3"/><circle cx="482.6" cy="109.0" r="5" fill="#e6edf3"/><text x="496.6" y="114.0" font-size="13" font-weight="bold" fill="#e6edf3">X</text></g><g class="row" style="animation-delay:0.75s"><rect x="527.2" y="92.0" width="79.0" height="34" rx="17.0" fill="#1d1330" stroke="#D14836" stroke-width="1.3"/><circle cx="547.2" cy="109.0" r="5" fill="#D14836"/><text x="561.2" y="114.0" font-size="13" font-weight="bold" fill="#e6edf3">Email</text></g>

<g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="150" height="160" fill="url(#shg)"/></g>
</svg>