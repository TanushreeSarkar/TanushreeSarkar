<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260" role="img" aria-label="Tanushree Sarkar achievements">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px) skewX(-15deg)}60%,100%{transform:translateX(640px) skewX(-15deg)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 5s ease-in-out 2.4s infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s ease-in-out infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff7eb6;#c084fc;#ff7eb6" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#c084fc;#ff7eb6;#c084fc" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cc"><rect x="1" y="1" width="498" height="258" rx="16"/></clipPath>
</defs>

<rect x="1" y="1" width="498" height="258" rx="16" fill="#170e28" stroke="url(#tg)" stroke-width="1.5"/>
<text x="26" y="42" font-size="18" font-weight="bold" fill="url(#tg)">🏆 Achievements</text>
<line x1="26" y1="56" x2="474" y2="56" stroke="#2a1f3d" stroke-width="1"/>

<g class="tw" style="animation-delay:.4s"><path d="M452 28l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#fde047"/></g>

  <g class="row" style="animation-delay:0.35s">
    <circle cx="34" cy="88" r="4" fill="#ff7eb6"/>
    <text x="50" y="93" font-size="13" fill="#e6edf3">Actively contributing to <tspan fill="#ff7eb6" font-weight="bold">open-source</tspan> projects</text>
  </g>
  <g class="row" style="animation-delay:0.55s">
    <circle cx="34" cy="128" r="4" fill="#c084fc"/>
    <text x="50" y="133" font-size="13" fill="#e6edf3">Consistently improving on <tspan fill="#c084fc" font-weight="bold">HackerRank</tspan> &amp; <tspan fill="#c084fc" font-weight="bold">LeetCode</tspan></text>
  </g>
  <g class="row" style="animation-delay:0.75s">
    <circle cx="34" cy="168" r="4" fill="#7dd3fc"/>
    <text x="50" y="173" font-size="13" fill="#e6edf3">Building a community via blogging —</text>
    <text x="50" y="192" font-size="17" font-weight="bold" fill="#7dd3fc">10,000+ readers</text>
  </g>

<rect x="26" y="216" width="448" height="24" rx="12" fill="#1d1330" opacity="0" style="animation:fadeUp .5s ease 1s forwards"/>
<text x="250" y="232" text-anchor="middle" font-size="11" fill="#8b949e" opacity="0" style="animation:fadeUp .5s ease 1.1s forwards">Growing one commit at a time ✨</text>

<g clip-path="url(#cc)"><rect class="sh" x="0" y="0" width="120" height="260" fill="url(#shg)"/></g>
</svg>
